name: Unpack V3 and Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project ZIP
        shell: bash
        run: |
          set -e
          test -f AndroidResearchAgentV3_UPLOAD.zip
          unzip -o AndroidResearchAgentV3_UPLOAD.zip -d .
          rm AndroidResearchAgentV3_UPLOAD.zip
          mkdir -p .github/workflows
          cat > .github/workflows/build.yml <<'EOF'
          name: Build Android V3
          on:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - name: Set up Android SDK
                  uses: android-actions/setup-android@v3
                - name: Install SDK packages
                  run: |
                    yes | sdkmanager --licenses > /dev/null || true
                    sdkmanager "platforms;android-36" "build-tools;36.0.0"
                - name: Install Gradle
                  uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '8.13'
                - name: Build APK
                  run: gradle assembleDebug --no-daemon
                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: research-agent-v3-debug
                    path: app/build/outputs/apk/debug/app-debug.apk
          EOF

      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unpack Android Research Agent V3" || echo "Nothing to commit"
          git push
