name: Build Android V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V3 ZIP file not found"
            exit 1
          fi

          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

          if [ -d "project/AndroidResearchAgentV3" ]; then
            mv project/AndroidResearchAgentV3/* project/
            mv project/AndroidResearchAgentV3/.[!.]* project/ 2>/dev/null || true
            rmdir project/AndroidResearchAgentV3 2>/dev/null || true
          fi

          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android V3
        working-directory: project
        run: |
          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: research-agent-v3-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
